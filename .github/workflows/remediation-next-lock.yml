name: Remediation Next.js Lockfile

on:
  push:
    branches:
      - security/p0-remediation-2026-08
    paths:
      - .github/workflows/remediation-next-lock.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: security/p0-remediation-2026-08

      - name: Use Node.js 20.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate patched Next.js package files
        run: npm install --prefix frontend next@16.3.3 eslint-config-next@16.3.3 --save-exact --package-lock-only

      - name: Confirm resolved Next.js version
        run: node -e "const l=require('./frontend/package-lock.json'); if(l.packages['node_modules/next'].version!=='16.3.3') process.exit(1); console.log(l.packages['node_modules/next'].version)"

      - name: Commit generated package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "SECURITY: upgrade Next.js to 16.3.3"
          git push origin HEAD:security/p0-remediation-2026-08

      - name: Upload generated package files
        uses: actions/upload-artifact@v4
        with:
          name: remediation-next-16.3.3
          path: |
            frontend/package.json
            frontend/package-lock.json
          if-no-files-found: error
          retention-days: 1
