name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_RPC_URL: "https://bsc-testnet.publicnode.com"
      NEXT_PUBLIC_CHAIN_ID: "97"
      NEXT_PUBLIC_FACTORY_ADDRESS: "0x0000000000000000000000000000000000000000"
      NEXT_PUBLIC_TOKEN_ADDRESS: "0x0000000000000000000000000000000000000000"
      NEXT_PUBLIC_BSCSCAN_BASE: "https://testnet.bscscan.com"
      NEXT_PUBLIC_WC_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20.9.0
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install dependencies (root)
        run: npm ci
      - name: Check backend state and auth
        run: npm run backend:check
      - name: Compile contracts
        run: npm run compile
      - name: Test contracts
        run: npm run test:contracts
      - name: Rehearse V2 deploy and smoke
        env:
          ARBITRATOR_ADDRESS: "0x1111111111111111111111111111111111111111"
        run: |
          set -euo pipefail
          npx hardhat node > /tmp/tes-crowdfund-hardhat.log 2>&1 &
          NODE_PID=$!
          trap 'kill "$NODE_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 20); do
            if curl --silent --fail \
              --header 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              http://127.0.0.1:8545 | grep -q '"result"'; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/tes-crowdfund-hardhat.log
            echo "Hardhat local node did not become ready." >&2
            exit 1
          fi

          npx hardhat run scripts/deploy.ts --network localhost
          npx hardhat run scripts/smoke.ts --network localhost
      - name: Preflight
        run: npm run preflight
      - name: Install dependencies (frontend)
        run: npm --prefix frontend ci
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Build frontend
        run: npm --prefix frontend run build
